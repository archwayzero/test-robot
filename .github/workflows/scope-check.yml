name: scope-check
on:
  pull_request:
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Branch scope, DVC and decoupling checks
        run: python3 -I tools/precommit_checks.py --ci "origin/${{ github.base_ref }}"
